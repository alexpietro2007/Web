<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/style/gridSystemBootStrap.css">
    <title>Off Set</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container mt-2 p-5 border border-danger border-2">
        <div class="row border border-dark border-2">
            <div class="col-md-6 offset-md-3 border-primary border border-2 my-2">6 coluns e offset de 3, a partir de tamanho médio</div>
        </div>
        <div class="row border border-dark border-2">
            <div class="col-md-4 offset-md-2 border-success border border-2 my-2">4 coluns e offset de 2, a partir de tamanho médio</div>
            <div class="col-md-3 offset-md-3 border border-success border-2 my-2">3 colunas e offset de 3, a partir de tamanho médio</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

</html>
