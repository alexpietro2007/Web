<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Forms</title>
</head>

<body>
    <form action="">

        <p>
            <h3>Informações Basicas:</h3>
            <label> 
                Primeiro Nome:
                <input type="text">
            </label> 
            <label>
                Sobrenome:
                <input type="text">
            </label>
        </p>

        <p>
            <h3>Contato:</h3>
            <label>
                Email:
                <input type="email">
            </label>
            <label>
                Telefone:
                <input type="tel">
            </label>
        </p>
        <p>
            <label>
                Cor:
                <input type="color">
            </label>
        </p>

        <input type="submit" value="Enviar">
    </form>
</body>

</html>
