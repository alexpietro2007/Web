<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Forms</title>
    <style>
        textarea{
            resize: none
        }
    </style>
</head>

<body>
    <form action="">

        <p>
            <h3>Informações Basicas:</h3>
            <label> 
                Primeiro Nome:
                <input type="text">
            </label> 
            <label>
                Sobrenome:
                <input type="text">
            </label>
        </p>

        <p>
            <h3>Contato:</h3>
            <label>
                Email:
                <input type="email">
            </label>
            <label>
                Telefone:
                <input type="tel">
            </label>
        </p>
        <p>
            <label>
                Cor:
                <input type="color">
            </label>
        </p>
        <p>
            <label>
                Arquivo:
                <input type="file" id="">
            </label>
        </p>
        <p>
            <label>
                Deixe Sua Mensagem: 
                <textarea name="" rows="6" cols="40" placeholder="Insira Seu Comentario" required></textarea>
            </label>
        </p>
        <input type="submit" value="Enviar">
    </form>
</body>

</html>
