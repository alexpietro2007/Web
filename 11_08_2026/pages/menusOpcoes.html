<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Menus</title>
</head>

<body>
    <form action="">
        <h4>Muitas Escolha</h4>
        <p>
            <label>
                Estados:
                <select name="estados">
                    <option value="sp">São Paulo</option>
                    <option value="bh">Bahia</option>
                    <option value="es">Espirito Santos</option>
                    <option value="rj">Rio de Janeiro</option>
                </select>
            </label>
        </p>
        <fieldset>
            <legend>Qual sua Preferencia? </legend>
            <input type="radio" name="carros" id="x1"><label>X1</label>
            <input type="radio" name="carros" id="macerrati"><label>Macerrati</label>
            <input type="radio" name="carros" id="cadilac"><label>Cadilac</label>
            <input type="radio" name="carros" id="opala_8cl"><label>Opala 8CL</label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Qual Sua Cor favorita ?:</legend>
            <input type="checkbox" name="cor" id="rosa"><label>Rosa</label>
            <input type="checkbox" name="cor" id="azul"><label>Azul</label>
            <input type="checkbox" name="cor" id="branco"><label>Branco</label>
            <input type="checkbox" name="cor" id="preto"><label>Preto</label>
        </fieldset>
        
        <input type="submit" value="Enviar">
    </form>
        
    </body>
    
    </html>
