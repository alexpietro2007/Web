<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tabelas</title>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.</td>
                <td>João</td>
                <td>20</td>
            </tr>
            <tr>
                <td>2.</td>
                <td>Maria</td>
                <td>19</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td> - </td>
                <td> - </td>
                <td> Versão 2.0 </td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
